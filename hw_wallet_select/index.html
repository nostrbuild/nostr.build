<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#24204b">
<title>Hardware Wallet Finder | nostr.build</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#292556; --bg2:#1e1530; --surface:rgba(54,45,105,.55); --surface-solid:#2f2860;
  --ink:#ffffff; --muted:#d0bed8; --faint:#a58ead; --line:rgba(208,190,216,.22);
  --accent:#924eb5; --accent-hi:#bf8ed9; --on-accent:#ffffff;
  --match:#2edf95; --match-soft:rgba(46,223,149,.14); --warn:#f4b82a; --miss:#ff9a8a;
  --font:Montserrat,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="light"]{
  --bg1:#f6f4f9; --bg2:#ece5f2; --surface:#ffffff; --surface-solid:#ffffff;
  --ink:#24204b; --muted:#5a4a78; --faint:#7a6690; --line:#ddd1e8;
  --accent:#6f3c9f; --accent-hi:#6f3c9f; --on-accent:#ffffff;
  --match:#07847c; --match-soft:#dff3ee; --warn:#b36b00; --miss:#b3261e;
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    --bg1:#f6f4f9; --bg2:#ece5f2; --surface:#ffffff; --surface-solid:#ffffff;
    --ink:#24204b; --muted:#5a4a78; --faint:#7a6690; --line:#ddd1e8;
    --accent:#6f3c9f; --accent-hi:#6f3c9f; --on-accent:#ffffff;
    --match:#07847c; --match-soft:#dff3ee; --warn:#b36b00; --miss:#b3261e;
  }
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(90px + env(safe-area-inset-top,0px));background:var(--bg2)}
body{margin:0;min-height:100vh;background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 100%) fixed;background-color:var(--bg2);color:var(--ink);font:16px/1.55 var(--font)}
a{color:var(--accent-hi)}

/* Site header, as on account.nostr.build */
.site{max-width:1180px;margin:0 auto;padding:1rem 1.25rem;display:flex;align-items:center;justify-content:space-between;gap:1rem}
.brand{display:inline-flex;align-items:center;text-decoration:none}
.brand svg{height:36px;width:auto;display:block}
.logo-co{display:none!important}
:root[data-theme="light"] .logo-lt{display:none!important}
:root[data-theme="light"] .logo-co{display:block!important}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]) .logo-lt{display:none!important}
  :root:not([data-theme="dark"]) .logo-co{display:block!important}
}
.site nav{display:flex;gap:1.25rem}
.site nav a{color:var(--ink);text-decoration:none;font-weight:600;font-size:.95rem}
.site nav a:hover{color:var(--accent-hi)}

.wrap{max-width:1180px;margin:0 auto;padding:1.5rem 1.25rem 3rem}
.crumb{color:var(--faint);font-weight:600;font-size:.9rem;margin:0 0 .35rem}
header.page h1{font-weight:800;font-size:clamp(2rem,5vw,3rem);line-height:1.08;margin:0 0 .6rem;letter-spacing:-.02em}
header.page p{margin:0;color:var(--muted);max-width:60ch}

/* Matches window */
.picks{position:sticky;top:calc(.75rem + env(safe-area-inset-top,0px));z-index:5;margin-top:1.5rem;background:var(--surface-solid);border:1px solid var(--accent);border-radius:14px;padding:.8rem 1rem;box-shadow:0 10px 30px rgba(21,13,41,.35)}
.picks[hidden]{display:none}
.picks-head{font-weight:700;font-size:.9rem;color:var(--muted);margin:0 0 .45rem}
.picks-list{display:flex;flex-wrap:wrap;gap:.45rem}
.picks-list a{display:inline-block;padding:.35rem .8rem;border-radius:999px;background:var(--match-soft);color:var(--match);font-weight:700;font-size:.9rem;text-decoration:none;border:1px solid var(--match)}
.picks-list a:hover{background:var(--match);color:var(--bg2)}
.picks-empty{color:var(--miss);font-weight:600;font-size:.9rem;margin:0}
@media (prefers-reduced-motion:no-preference){.picks{animation:drop .2s ease-out}@keyframes drop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}}

.layout{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:1.75rem;margin-top:1.5rem;align-items:start}
@media (max-width:860px){.layout{grid-template-columns:1fr}}

.filters{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:1.25rem}
.filters h2{font-size:1.2rem;font-weight:700;margin:0 0 .25rem}
.filters .hint{color:var(--faint);font-size:.88rem;margin:0 0 1rem}
.f{padding:.8rem 0;border-top:1px solid var(--line)}
.f-label{font-weight:600;font-size:.92rem;margin-bottom:.45rem;display:block}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;font:inherit;font-size:.85rem;font-weight:500;padding:.45rem .3rem;border:0;background:transparent;color:var(--ink);cursor:pointer;border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);font-weight:700}
.seg button:focus-visible,.chip:focus-visible,.reset:focus-visible,a:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:.4rem}
.chip{font:inherit;font-size:.83rem;font-weight:500;padding:.3rem .75rem;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.reset{margin-top:1rem;width:100%;font:inherit;font-weight:700;padding:.65rem;border-radius:10px;border:1px solid var(--accent-hi);background:transparent;color:var(--ink);cursor:pointer}
.reset:hover{background:var(--accent);border-color:var(--accent)}

.summary{font-size:1.4rem;font-weight:700;margin:0 0 1rem;line-height:1.25}
.summary small{display:block;font-size:.92rem;font-weight:400;color:var(--muted);margin-top:.25rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:1rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:1.1rem;display:flex;flex-direction:column;gap:.7rem}
.card.match{border:2px solid var(--match)}
.card.miss{opacity:.6}
.card h3{font-weight:700;font-size:1.2rem;line-height:1.2;margin:0}
.origin{color:var(--faint);font-size:.85rem;margin-top:.15rem}
.status{font-size:.8rem;font-weight:700;padding:.3rem .6rem;border-radius:6px;align-self:flex-start}
.status.ok{background:var(--match-soft);color:var(--match)}
.status.no{color:var(--miss);border:1px solid currentColor}
.missing{margin:0;padding:0;list-style:none;font-size:.85rem;color:var(--miss)}
.missing li::before{content:"✕ ";font-weight:700}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:.3rem .75rem;font-size:.85rem;border-top:1px solid var(--line);padding-top:.7rem}
dt{color:var(--faint)}
dd{margin:0;font-weight:600}
dd.caveat{color:var(--warn)}
@media (prefers-reduced-motion:no-preference){.card{transition:opacity .2s,border-color .2s}}

footer.site-foot{max-width:1180px;margin:0 auto;padding:1rem 1.25rem 2rem;color:var(--faint);font-size:.85rem;display:flex;gap:.75rem;flex-wrap:wrap}
footer.site-foot a{color:var(--faint)}
</style>
</head>

<div class="wrap">
  <header class="page">
    <p class="crumb">Help</p>
    <h1>Find your hardware wallet</h1>
    <p>Pick the features that matter to you. Wallets that meet every choice rise to the top; the rest show exactly what they're missing.</p>
  </header>

  <section class="picks" id="picks" hidden aria-live="polite" aria-label="Matching wallets">
    <p class="picks-head" id="picksHead"></p>
    <div class="picks-list" id="picksList"></div>
  </section>

  <div class="layout">
    <aside class="filters" aria-label="Feature filters">
      <h2>Features</h2>
      <p class="hint">Leave anything on "Any" if you don't care about it.</p>
      <div id="filterControls"></div>
      <div class="f">
        <span class="f-label" id="countryLabel">Country of origin</span>
        <div class="chips" id="countryChips" role="group" aria-labelledby="countryLabel"></div>
      </div>
      <button class="reset" id="reset" type="button">Clear all filters</button>
    </aside>

    <main>
      <p class="summary" id="summary"></p>
      <div class="grid" id="grid"></div>
    </main>
  </div>
</div>

<footer class="site-foot"><a href="https://account.nostr.build/tos">Terms of Service</a><a href="https://account.nostr.build/privacy">Privacy Policy</a></footer>
<script>
const wallets = [
  {name:"Foundation Prime", country:"USA", open:"yes", chip:"EAL6+", se:true, eal6:true, multisig:"yes", seed:"yes", camera:"yes", large:"no", exploit:"no", backups:"yes"},
  {name:"Blockstream Jade", country:"Canada", open:"yes", chip:"Blind Oracle (no secure element)", se:false, eal6:false, multisig:"yes", seed:"yes", camera:"yes", large:"no", exploit:"yes", exploitNote:"LiquidBTC", backups:"no"},
  {name:"BitBox02 Nova", country:"Switzerland", open:"yes", chip:"EAL6+", se:true, eal6:true, multisig:"yes", seed:"yes", camera:"no", large:"no", exploit:"no", backups:"no"},
  {name:"SeedSigner", country:"USA", open:"yes", chip:"None", se:false, eal6:false, multisig:"yes", seed:"yes", camera:"yes", large:"no", exploit:"no", backups:"no"},
  {name:"Block BitKey", country:"USA", open:"no", chip:"EAL6+", se:true, eal6:true, multisig:"partial", multisigNote:"Native 2-of-3 only", seed:"no", camera:"no", large:"yes", exploit:"no", backups:"yes"},
  {name:"Coinkite Q MK5", country:"Canada", open:"yes", chip:"2 secure elements", chipLink:"https://coldcard.com/docs/physical-notes/", se:true, eal6:false, multisig:"yes", seed:"yes", camera:"yes", large:"no", exploit:"yes", exploitNote:"RNG seeds", backups:"no"},
  {name:"OneKey", country:"Hong Kong", open:"yes", chip:"EAL6+", se:true, eal6:true, multisig:"yes", seed:"yes", camera:"no", large:"yes", exploit:"no", backups:"no"},
  {name:"Trezor", country:"Czech Republic", open:"yes", chip:"EAL6+", se:true, eal6:true, multisig:"yes", seed:"yes", camera:"no", large:"yes", exploit:"yes", exploitNote:"Sales data leak", backups:"no"},
  {name:"Ledger", country:"France", open:"no", chip:"EAL5+, EAL6+", se:true, eal6:true, multisig:"yes", seed:"yes", camera:"no", large:"yes", exploit:"yes", exploitNote:"Sales data leak", backups:"yes"}
];

// Each filter: key, label, options [value,label], and how to test + describe a miss
const filters = [
  {key:"open", label:"Open source", opts:[["any","Any"],["yes","Yes"],["no","No"]]},
  {key:"chip", label:"Security chip", opts:[["any","Any"],["se","Has one"],["eal6","EAL6+"]],
    test:(w,v)=> v==="se" ? w.se : w.eal6,
    miss:(w,v)=> v==="se" ? "No secure element" : "Not EAL6+ certified"},
  {key:"multisig", label:"Multisig support", opts:[["any","Any"],["yes","Yes"],["no","No"]],
    test:(w,v)=> v==="yes" ? w.multisig!=="no" : w.multisig==="no"},
  {key:"seed", label:"Seed phrase access", opts:[["any","Any"],["yes","Yes"],["no","No"]]},
  {key:"camera", label:"Air-gap camera", opts:[["any","Any"],["yes","Yes"],["no","No"]]},
  {key:"large", label:"Large company", opts:[["any","Any"],["yes","Yes"],["no","No"]]},
  {key:"exploit", label:"Major exploit history", opts:[["any","Any"],["no","None"],["yes","Has one"]]},
  {key:"backups", label:"Easy backups (inheritance, contacts, emergency exit)", opts:[["any","Any"],["yes","Yes"],["no","No"]]}
];

const state = {countries:new Set()};
filters.forEach(f=>state[f.key]="any");
const countries = [...new Set(wallets.map(w=>w.country))];

function defaultMiss(f,v){
  const word = f.opts.find(o=>o[0]===v)[1];
  if(f.key==="exploit") return v==="no" ? "Has a major exploit" : "No major exploit";
  return (v==="yes" ? "No " : "Has ") + f.label.toLowerCase().split(" (")[0];
}

function evaluate(w){
  const misses=[];
  filters.forEach(f=>{
    const v=state[f.key];
    if(v==="any") return;
    const ok = f.test ? f.test(w,v) : w[f.key]===v;
    if(!ok) misses.push(f.miss ? f.miss(w,v) : defaultMiss(f,v));
  });
  if(state.countries.size && !state.countries.has(w.country)) misses.push("Made in "+w.country);
  return misses;
}

function slug(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,"-")}
function yn(v){return v==="yes"?"Yes":v==="no"?"No":"Partial"}

function render(){
  const results = wallets.map(w=>({w,misses:evaluate(w)}))
    .sort((a,b)=>a.misses.length-b.misses.length);
  const matches = results.filter(r=>!r.misses.length).length;
  const active = filters.filter(f=>state[f.key]!=="any").length + (state.countries.size?1:0);

  const s=document.getElementById("summary");
  if(!active){
    s.innerHTML=`All ${wallets.length} wallets<small>Choose features on the left to narrow the list.</small>`;
  } else if(matches===0){
    s.innerHTML=`No wallet has all of those<small>The closest options are listed first. Try setting one feature back to "Any".</small>`;
  } else {
    s.innerHTML=`${matches} ${matches===1?"wallet matches":"wallets match"}<small>Matching ${active} ${active===1?"feature":"features"}.</small>`;
  }

  const picks=document.getElementById("picks");
  picks.hidden = !active;
  if(active){
    const names=results.filter(r=>!r.misses.length).map(r=>r.w.name);
    document.getElementById("picksHead").textContent = names.length ? `Wallets with all ${active} selected ${active===1?"feature":"features"}` : "Your picks";
    document.getElementById("picksList").innerHTML = names.length
      ? names.map(n=>`<a href="#w-${slug(n)}">${n}</a>`).join("")
      : `<p class="picks-empty">No wallet has every selected feature.</p>`;
  }

  document.getElementById("grid").innerHTML = results.map(({w,misses})=>{
    const isMatch=!misses.length;
    const chip = w.chipLink ? `<a href="${w.chipLink}" target="_blank" rel="noopener">${w.chip}</a>` : w.chip;
    return `<article id="w-${slug(w.name)}" class="card ${active?(isMatch?"match":"miss"):""}">
      <div><h3>${w.name}</h3><div class="origin">${w.country}</div></div>
      ${active ? (isMatch ? `<span class="status ok">Matches everything</span>`
        : `<span class="status no">Missing ${misses.length}</span><ul class="missing">${misses.map(m=>`<li>${m}</li>`).join("")}</ul>`) : ""}
      <dl>
        <dt>Open source</dt><dd>${yn(w.open)}</dd>
        <dt>Security chip</dt><dd>${chip}</dd>
        <dt>Multisig</dt><dd class="${w.multisig==="partial"?"caveat":""}">${w.multisig==="partial"?w.multisigNote:yn(w.multisig)}</dd>
        <dt>Seed phrase access</dt><dd>${yn(w.seed)}</dd>
        <dt>Air-gap camera</dt><dd>${yn(w.camera)}</dd>
        <dt>Large company</dt><dd>${yn(w.large)}</dd>
        <dt>Major exploit</dt><dd class="${w.exploit==="yes"?"caveat":""}">${w.exploit==="yes"?w.exploitNote:"None"}</dd>
        <dt>Easy backups</dt><dd>${yn(w.backups)}</dd>
      </dl>
    </article>`;
  }).join("");
}

function buildControls(){
  const box=document.getElementById("filterControls");
  box.innerHTML = filters.map(f=>`
    <div class="f">
      <span class="f-label" id="lbl-${f.key}">${f.label}</span>
      <div class="seg" role="group" aria-labelledby="lbl-${f.key}">
        ${f.opts.map(([v,l])=>`<button type="button" data-key="${f.key}" data-val="${v}" aria-pressed="${state[f.key]===v}">${l}</button>`).join("")}
      </div>
    </div>`).join("");
  box.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{
    state[b.dataset.key]=b.dataset.val;
    box.querySelectorAll(`button[data-key="${b.dataset.key}"]`).forEach(x=>x.setAttribute("aria-pressed",x===b));
    render();
  }));

  const cc=document.getElementById("countryChips");
  cc.innerHTML = countries.map(c=>`<button type="button" class="chip" data-c="${c}" aria-pressed="${state.countries.has(c)}">${c}</button>`).join("");
  cc.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{
    const c=b.dataset.c;
    state.countries.has(c)?state.countries.delete(c):state.countries.add(c);
    b.setAttribute("aria-pressed",state.countries.has(c));
    render();
  }));
}

document.getElementById("reset").addEventListener("click",()=>{
  filters.forEach(f=>state[f.key]="any");
  state.countries.clear();
  buildControls(); render();
});

buildControls(); render();
</script>
</body>
</html>
